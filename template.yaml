          Properties:
            RestApiId: !Ref CrmApi
            Path: /certs
            Method: get
        GetCert:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /certs/{certId}
            Method: get
        RenewCert:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /certs/{certId}/renew
            Method: post

  ApiIamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-api-iam-fn
