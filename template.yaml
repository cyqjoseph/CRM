      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IamAccountsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditHotTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref RotationSfn
        - Statement:
            - Effect: Allow
              Action:
