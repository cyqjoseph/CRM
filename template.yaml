            Method: post

  ApiAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-api-audit-fn
      CodeUri: functions/api_audit/
      Handler: app.handler
      Environment:
        Variables:
          AUDIT_TABLE_NAME: !Ref AuditHotTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AuditHotTable
        - Statement:
            - Effect: Allow
              Action: states:DescribeExecution
              Resource:
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${DiscoverySfn.Name}:*"
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${RenewalSfn.Name}:*"
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${RotationSfn.Name}:*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        GetAudit:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /audit
            Method: get
        GetExecution:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /executions/{executionId}
            Method: get

  # Unauthenticated connectivity probe used to tell a dead CloudFront/API
  # Gateway/Lambda wiring apart from a CORS or Cognito-authorizer failure —
  # every other route requires a valid Cognito token, so a 403 there is
  # ambiguous between "no token" and "the plumbing itself is broken".
  ApiHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-api-health-fn
      CodeUri: functions/api_health/
      Handler: app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE

  ApiPasswordResetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-api-password-resets-fn
