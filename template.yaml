  # EventBridge schedules
  # ---------------------------------------------------------------------------
  EventBridgeSfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-d9fae51c-1929cc69-eventbridge-sfn-role
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-discovery-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DiscoverySfn

  DiscoveryScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-d9fae51c-1929cc69-discovery-daily
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: DiscoverySfnTarget
          Arn: !Ref DiscoverySfn
          RoleArn: !GetAtt EventBridgeSfnRole.Arn

  ExpiryScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-d9fae51c-1929cc69-expiry-hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: ExpiryEvaluatorTarget
          Arn: !GetAtt ExpiryEvaluatorFunction.Arn

  ExpiryEvaluatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExpiryEvaluatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryScheduleRule.Arn

