  # Invoked only by PasswordResetSfn, never directly over the API — generates
  # and SHA-256 hashes a temporary password and stores just the hash+metadata
  # in PasswordResetCredentialsSecret. The plaintext value never leaves this
  # function's memory (C-02); delivering it by email is out of scope since SES
  # is not an allowed service here. See README.md's Deviations section.
  PasswordResetExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-password-reset-executor-fn
      CodeUri: functions/password_reset_executor/
      Handler: app.handler
      Environment:
        Variables:
          PASSWORD_RESET_CREDENTIALS_SECRET_ARN: !Ref PasswordResetCredentialsSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Ref PasswordResetCredentialsSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

