  # refused as a cross-owner lookup. It answered 403 to real use.
  #
  # The audit TRAIL is untouched: the state machines and put_audit_event still
  # write every action to AuditHotTable and audit-exporter-fn still archives it.
  # Only the search endpoint is gone, which is why this function no longer reads
  # any DynamoDB table at all.
  ApiExecutionsFunction:
