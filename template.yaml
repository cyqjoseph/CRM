          AUDIT_TABLE_NAME: !Ref AuditHotTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PasswordResetRequestsTable
        - DynamoDBWritePolicy:
            TableName: !Ref PasswordResetRequestsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IamAccountsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditHotTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        CreatePasswordReset:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /password-resets
            Method: post
        ListPasswordResets:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /password-resets
            Method: get

  PasswordResetApproverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-password-reset-approver-fn
      CodeUri: functions/password_reset_approver/
      Handler: app.handler
      Environment:
        Variables:
          PASSWORD_RESET_TABLE_NAME: !Ref PasswordResetRequestsTable
          PASSWORD_RESET_STATE_MACHINE_ARN: !Ref PasswordResetSfn
          PASSWORD_RESET_NOTIFICATIONS_TOPIC_ARN: !Ref PasswordResetNotificationsTopic
          AUDIT_TABLE_NAME: !Ref AuditHotTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PasswordResetRequestsTable
        - DynamoDBWritePolicy:
            TableName: !Ref PasswordResetRequestsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditHotTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt PasswordResetNotificationsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref PasswordResetSfn
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        ApprovePasswordReset:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /password-resets/{requestId}/approve
            Method: post
        RejectPasswordReset:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /password-resets/{requestId}/reject
            Method: post

  # Invoked only by PasswordResetSfn, never directly over the API — generates
  # and SHA-256 hashes a temporary password and stores just the hash+metadata
  # in PasswordResetCredentialsSecret. The plaintext value never leaves this
  # function's memory (C-02); delivering it by email is out of scope since SES
  # is not an allowed service here. See README.md's Deviations section.
  PasswordResetExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-password-reset-executor-fn
      CodeUri: functions/password_reset_executor/
      Handler: app.handler
      Environment:
        Variables:
          PASSWORD_RESET_CREDENTIALS_SECRET_ARN: !Ref PasswordResetCredentialsSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Ref PasswordResetCredentialsSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  # Stub proxy for future on-prem (Ansible-driven) inventory sync. Passes the
  # request body straight through to DynamoDB with no validation — see
  # ansible/README.md and the TODO in functions/sync_on_prem/app.py. Not
  # wired to any real on-prem system; nothing today calls this route.
  SyncOnPremFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-sync-on-prem-fn
      CodeUri: functions/sync_on_prem/
      Handler: app.handler
      Environment:
        Variables:
          CERT_TABLE_NAME: !Ref CertInventoryTable
          IAM_TABLE_NAME: !Ref IamAccountsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CertInventoryTable
        - DynamoDBWritePolicy:
            TableName: !Ref IamAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        SyncOnPremData:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /sync/on-prem-data
            Method: post

  AuditExporterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-audit-exporter-fn
      CodeUri: functions/audit_exporter/
      Handler: app.handler
      Environment:
        Variables:
          ARCHIVE_BUCKET_NAME: !Ref AuditArchiveBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AuditArchiveBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        AuditStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AuditHotTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10

  # ---------------------------------------------------------------------------
  # Step Functions state machines
  # ---------------------------------------------------------------------------
  DiscoverySfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-d9fae51c-1929cc69-discovery-sfn-role
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "states.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: discovery-sfn-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt DiscoveryAcmFunction.Arn
                  - !GetAtt DiscoveryIamFunction.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditHotTable.Arn

  DiscoverySfn:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: app-d9fae51c-1929cc69-discovery-sfn
      DefinitionUri: statemachines/discovery.asl.json
      DefinitionSubstitutions:
        DiscoveryAcmFunctionArn: !GetAtt DiscoveryAcmFunction.Arn
        DiscoveryIamFunctionArn: !GetAtt DiscoveryIamFunction.Arn
        AuditTableName: !Ref AuditHotTable
      Role: !GetAtt DiscoverySfnRole.Arn
      Tracing:
        Enabled: true

  RenewalSfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-d9fae51c-1929cc69-renewal-sfn-role
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
