            TableName: !Ref AuditHotTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref RenewalSfn
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        ListCerts:
