AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Centralised Resource Manager Cross-Environments — certificate and IAM/AD
  account lifecycle discovery, expiry alerting, renewal/rotation, and a
  self-service audited UI. See spec/ and docs/ for the approved
  requirements/design.

Parameters:
  JiraBaseUrl:
    Type: String
    Default: https://example.atlassian.net
    Description: Base URL of the Jira Cloud instance tickets are created in.
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: >
      Latest Ubuntu 22.04 LTS AMI, resolved at deploy time from Canonical's
      own public SSM parameter — never a hand-pinned AMI id that goes stale.
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
    Environment:
      Variables:
        # Kept in step with CrmApi's Cors property below. SAM merges these
        # Globals variables with each function's own Environment.Variables.
        CORS_ALLOW_ORIGIN: "*"
        CORS_ALLOW_METHODS: "GET, POST, OPTIONS"
        CORS_ALLOW_HEADERS: "Content-Type, Authorization"
        # The OwnerId partition every CRM login can read. OwnerId is OwnerIndex's
        # HASH key, so its value is what decides who sees a row: a per-Cognito-sub
        # value gave each team member a private dashboard and showed every
        # discovered row to nobody. Declared here because both the readers (the
        # API functions) and the writers (discovery, the seeder) must agree on it.
        # Kept in step with crm_common.SHARED_OWNER_ID and
        # scripts/gen_demo_data.py's SHARED_OWNER_ID.
        SHARED_OWNER_ID: crm-resource-owners
    Layers:
      - !Ref CommonLayer

# Every function needs to create its own /aws/lambda/<name> log group and
# stream on first invocation — Lambda does not pre-create them. Globals.Function
# does not support a Policies property (SAM rejects it), so this statement is
# repeated on every function's own Policies list below instead of declared once
# here. Resource is deliberately "*", not scoped to a log group ARN: Lambda's
# own execution environment calls these APIs before the log group exists, so a
# resource-scoped grant would still be denied on the very first invocation.
#   - Statement:
#       - Effect: Allow
#         Action:
#           - logs:CreateLogGroup
#           - logs:CreateLogStream
#           - logs:PutLogEvents
#           - logs:DescribeLogGroups
#           - logs:DescribeLogStreams
#         Resource: "*"

Resources:
  # ---------------------------------------------------------------------------
  # Shared Lambda layer
  # ---------------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: app-d9fae51c-1929cc69-common-layer
      # Packaged verbatim, so the zip root keeps the python/ prefix that Lambda
      # requires to make crm_common importable.
      #
      # Deliberately NO `Metadata: BuildMethod: python3.13`. That routes the layer
      # through SAM's pip builder, which expects a requirements.txt manifest at
      # this ContentUri — there isn't one, because this layer is pure first-party
      # source with no third-party dependencies. Without the manifest the builder's
      # output is version-dependent, and if python/ is lost from the artifact root
      # every function fails init on `from crm_common import ...`, which API
      # Gateway reports only as 502 Bad Gateway.
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.13

  # ---------------------------------------------------------------------------
  # DynamoDB inventory + audit tables
  # ---------------------------------------------------------------------------
  CertInventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: app-d9fae51c-1929cc69-cert-inventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CertId
          AttributeType: S
        - AttributeName: OwnerId
          AttributeType: S
        - AttributeName: ExpiryDate
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
      KeySchema:
        - AttributeName: CertId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: OwnerId
              KeyType: HASH
            - AttributeName: ExpiryDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ExpiryIndex
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: ExpiryDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IamAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: app-d9fae51c-1929cc69-iam-accounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: AccountIdHash
          AttributeType: S
        - AttributeName: OwnerId
          AttributeType: S
        - AttributeName: NextRotationDate
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
      KeySchema:
        - AttributeName: AccountIdHash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: OwnerId
              KeyType: HASH
            - AttributeName: NextRotationDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: NextRotationDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuditHotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: app-d9fae51c-1929cc69-audit-hot
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EntityId
          AttributeType: S
        - AttributeName: EventTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: EntityId
          KeyType: HASH
        - AttributeName: EventTimestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # Append-only-in-spirit request log for the password reset approval queue.
  # Each RequestId gets exactly one row, mutated in place (pending -> approved/
  # rejected -> completed) — the actual append-only audit trail for these
  # actions lives in AuditHotTable, written on every state transition.
  PasswordResetRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: app-d9fae51c-1929cc69-password-reset-requests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: RequestId
          AttributeType: S
        - AttributeName: Timestamp
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
      KeySchema:
        - AttributeName: RequestId
          KeyType: HASH
        - AttributeName: Timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: Timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # S3: audit archive + self-service UI static site
  # ---------------------------------------------------------------------------
  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: app-d9fae51c-1929cc69-audit-archive
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: iam-account-retention-7yr
            Status: Enabled
            Prefix: iam-account/
            ExpirationInDays: 2555
          - Id: cert-retention-3yr
            Status: Enabled
            Prefix: cert/
            ExpirationInDays: 1095

  UiSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: app-d9fae51c-1929cc69-ui-site
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: app-d9fae51c-1929cc69-ui-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: app-d9fae51c-1929cc69-ui-cdn
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: ui-site-origin
            DomainName: !GetAtt UiSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt UiOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ui-site-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  UiSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiSiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${UiSiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${UiDistribution}"

  # ---------------------------------------------------------------------------
  # Cognito: self-signup user pool with owner/admin groups
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: app-d9fae51c-1929cc69-userpool
      # Must stay quoted: bare OFF is a YAML 1.1 boolean alias, so CloudFormation
      # would send the string 'false' and Cognito rejects it — its enum is
      # [OPTIONAL, OFF, ON].
      MfaConfiguration: "OFF"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: app-d9fae51c-1929cc69-userpool-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Lets scripts/validate.sh obtain an ID token without implementing SRP.
        # This flow requires AWS credentials (cognito-idp:AdminInitiateAuth), so
        # it is not reachable from the browser — ui/app.js still uses SRP.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED

  UserPoolOwnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: owners
      UserPoolId: !Ref UserPool

  UserPoolAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  CrmApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: app-d9fae51c-1929cc69-api
      StageName: prod
      TracingEnabled: true
      # The UI is served from CloudFront and calls this API on a different host,
      # sending `Authorization: <idToken>`. That custom header makes every request
      # non-simple, so the browser preflights with OPTIONS. Without Cors, SAM
      # generates no OPTIONS method and API Gateway answers 403 "Missing
      # Authentication Token" with no CORS headers.
      # AllowOrigin is '*' deliberately: the CloudFront domain is AWS-generated,
      # so pinning it would make this API depend on the distribution and serialise
      # every deploy behind a 5-10 minute CloudFront rollout. CORS is not the
      # security boundary here — the Cognito authorizer below is — and no cookies
      # or credentialed requests are used, so '*' is safe for this prototype.
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Must stay False. SAM defaults this to True, which attaches the Cognito
        # authorizer to the generated OPTIONS method — but a browser never sends
        # Authorization on a preflight, so it 401s and CORS fails anyway.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # API-Gateway-generated responses (an authorizer 401, a throttle 429, a 500)
  # never reach a Lambda, so they carry only the headers the matching
  # GatewayResponse defines. Without these, an expired token surfaces in the
  # browser as an opaque CORS error instead of a readable 401.
  ApiDefault4xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CrmApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  ApiDefault5xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CrmApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  # ---------------------------------------------------------------------------
  # SNS topics + SQS queues
  # ---------------------------------------------------------------------------
  AlertsLowTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-d9fae51c-1929cc69-alerts-low

  AlertsMediumTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-d9fae51c-1929cc69-alerts-medium

  AlertsHighTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-d9fae51c-1929cc69-alerts-high

  CompletionsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-d9fae51c-1929cc69-completions

  PasswordResetNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-d9fae51c-1929cc69-password-reset-notifications

  JiraDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: app-d9fae51c-1929cc69-jira-dlq
      MessageRetentionPeriod: 1209600

  JiraQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: app-d9fae51c-1929cc69-jira-queue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JiraDlq.Arn
        maxReceiveCount: 3

  # ---------------------------------------------------------------------------
  # Secrets Manager + SSM
  # ---------------------------------------------------------------------------
  JiraTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: app-d9fae51c-1929cc69-jira-token
      Description: Jira Cloud API token used by the jira-notifier function. Replace the placeholder after deploy.
      SecretString: '{"token":"REPLACE_ME"}'

  # Holds only SHA-256 hashes + metadata of temporary reset passwords, keyed by
  # RequestId — never the plaintext value itself (C-02). See
  # functions/password_reset_executor/app.py and README.md's Deviations section.
  PasswordResetCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: app-d9fae51c-1929cc69-password-reset-credentials
      Description: Hashes + metadata of generated temporary reset passwords, keyed by RequestId. Never contains a plaintext password.
      SecretString: "{}"

  ThresholdLowParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/thresholds/low
      Type: String
      Value: "30"

  ThresholdMediumParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/thresholds/medium
      Type: String
      Value: "14"

  ThresholdHighParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/thresholds/high
      Type: String
      Value: "7"

  PolicyAutoRenewAcmParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/policy/auto-renew-acm
      Type: String
      Value: "true"

  PolicyRotationIntervalDaysParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/policy/rotation-interval-days
      Type: String
      Value: "90"

  # ---------------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------------
  DiscoveryAcmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-discovery-acm-fn
      CodeUri: functions/discovery_acm/
      Handler: app.handler
      Environment:
        Variables:
          CERT_TABLE_NAME: !Ref CertInventoryTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CertInventoryTable
        # No acm:* here on purpose. ACM is not in CLAUDE.md's allowed-services
        # list, so the account permissions boundary denies it whatever this role
        # grants — see functions/discovery_acm/app.py.
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:ListSecrets
                - iam:ListServerCertificates
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  DiscoveryIamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-discovery-iam-fn
      CodeUri: functions/discovery_iam/
      Handler: app.handler
      Environment:
        Variables:
          IAM_TABLE_NAME: !Ref IamAccountsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref IamAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - iam:ListUsers
                - iam:ListAccessKeys
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  Ec2DiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-ec2-discovery-fn
      CodeUri: functions/ec2_discovery/
      Handler: app.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          EC2_INSTANCE_ID_PARAM: !Ref Ec2CertScannerInstanceIdParam
          CERT_TABLE: !Ref CertInventoryTable
          # The shared team partition, so every login sees what the scanner finds.
          # This value was already correct; what made these rows invisible was the
          # API querying OwnerIndex with the caller's Cognito sub instead.
          OWNER_ID: crm-resource-owners
          # Where Ec2CertScannerInstance's UserData installs the certificates it
          # issues (internal CA -> CSR -> signed leaf). Scanned in full.
          APP_CERT_DIR: /opt/app/certs
          # The OS trust store. Real certificates worth tracking, but ~140 of them
          # on Ubuntu, so it is capped rather than allowed to bury the application
          # certificates above.
          SYSTEM_CERT_DIR: /etc/ssl/certs
          SYSTEM_CERT_LIMIT: "50"
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Ec2CertScannerInstanceIdParam}"
        - Statement:
            - Effect: Allow
              Action:
                - ssm:SendCommand
                - ssm:GetCommandInvocation
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Ec2CertScannerInstance}"
        - DynamoDBReadPolicy:
            TableName: !Ref CertInventoryTable
        - DynamoDBWritePolicy:
            TableName: !Ref CertInventoryTable
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  ExpiryEvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-expiry-evaluator-fn
      CodeUri: functions/expiry_evaluator/
      Handler: app.handler
      Environment:
        Variables:
          CERT_TABLE_NAME: !Ref CertInventoryTable
          IAM_TABLE_NAME: !Ref IamAccountsTable
          AUDIT_TABLE_NAME: !Ref AuditHotTable
          JIRA_QUEUE_URL: !Ref JiraQueue
          SNS_TOPIC_LOW: !Ref AlertsLowTopic
          SNS_TOPIC_MEDIUM: !Ref AlertsMediumTopic
          SNS_TOPIC_HIGH: !Ref AlertsHighTopic
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CertInventoryTable
        - DynamoDBReadPolicy:
            TableName: !Ref IamAccountsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditHotTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsLowTopic.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsMediumTopic.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsHighTopic.TopicName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JiraQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  RenewalExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-renewal-executor-fn
      CodeUri: functions/renewal_executor/
      Handler: app.handler
      Environment:
        Variables:
          CERT_TABLE_NAME: !Ref CertInventoryTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CertInventoryTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  # Backs the "rotate" action for IAM access keys. Deliberately does NOT call
  # CreateAccessKey/DeactivateAccessKey/DeleteAccessKey against a real IAM user
  # — mutating live credentials automatically (e.g. from a UI button or a
  # schedule) is a high-blast-radius, hard-to-reverse action that could break a
  # production caller using that key. It only flags the account for rotation;
  # a human completes the actual key rotation out of band. See README.md's
  # Deviations section.
  RotationIamKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-rotation-iam-key-fn
      CodeUri: functions/rotation_iam_key/
      Handler: app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"

  JiraNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-jira-notifier-fn
      CodeUri: functions/jira_notifier/
      Handler: app.handler
      Environment:
        Variables:
          JIRA_TOKEN_SECRET_ARN: !Ref JiraTokenSecret
          JIRA_BASE_URL: !Ref JiraBaseUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JiraTokenSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        JiraQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JiraQueue.Arn
            BatchSize: 1

  ApiCertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-d9fae51c-1929cc69-api-certs-fn
      CodeUri: functions/api_certs/
      Handler: app.handler
      Environment:
        Variables:
          CERT_TABLE_NAME: !Ref CertInventoryTable
          AUDIT_TABLE_NAME: !Ref AuditHotTable
          RENEWAL_STATE_MACHINE_ARN: !Ref RenewalSfn
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CertInventoryTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditHotTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref RenewalSfn
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        ListCerts:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /certs
            Method: get
        GetCert:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /certs/{certId}
            Method: get
        RenewCert:
