                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource: "*"
      Events:
        ListIamAccounts:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /iam/accounts
            Method: get
        GetIamAccount:
          Type: Api
          Properties:
            RestApiId: !Ref CrmApi
            Path: /iam/accounts/{accountId}
