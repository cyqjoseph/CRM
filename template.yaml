  # ---------------------------------------------------------------------------
  # EC2 cert-scanner instance — source for OS-level certificate discovery
  # ---------------------------------------------------------------------------
  # No inbound rule at all, SSH included. The spec that requested this instance
  # asked for port 22 open to 0.0.0.0/0 "or restrict to Lambda security group if
  # possible" — Lambda isn't VPC-attached here, so there's no such group to
  # restrict to, and this same instance already gets its remote-access path from
  # AmazonSSMManagedInstanceCore below (Session Manager, over outbound 443, no
  # open port needed). Opening 22 to the internet would be pure unused attack
  # surface, so it's left off; the default egress-allow-all AWS adds when no
  # SecurityGroupEgress is specified covers apt/SSM/CloudWatch outbound.
  Ec2CertScannerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: app-d9fae51c-1929cc69-cert-scanner-sg
      GroupDescription: cert-scanner instance, no inbound, outbound only (SSM/apt)
      VpcId: vpc-01d3b02b0f1c07aa0

  Ec2CertScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-d9fae51c-1929cc69-cert-scanner-role
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        # Grants the cloudwatch:PutMetricData/logs:* the launch UserData below
        # needs to write the launch-success entry — no separate inline policy
        # required for that.
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  Ec2CertScannerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: app-d9fae51c-1929cc69-cert-scanner-profile
      Roles:
        - !Ref Ec2CertScannerRole

  Ec2CertScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: app-d9fae51c-1929cc69-ec2-cert-scanner
      RetentionInDays: 30

  Ec2CertScannerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: t3.micro
      SubnetId: subnet-0f43b5569d97d4bda
      SecurityGroupIds:
        - !Ref Ec2CertScannerSecurityGroup
      IamInstanceProfile: !Ref Ec2CertScannerInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: app-d9fae51c-1929cc69-cert-scanner
        - Key: Environment
          Value: hackathon-prototype
      # Plain Fn::Base64, not Fn::Sub — every value the script needs (region,
      # log group name) is a literal chosen in this template, so there's no
      # need to fight Fn::Sub's ${...} escaping against bash's own ${...}
      # syntax (IMDSv2 token, instance id, public IP).
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # SSM Agent ships pre-installed (as a snap) on the Ubuntu 22.04 AMI —
          # just make sure it's enabled and running.
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service || true
          systemctl start snap.amazon-ssm-agent.amazon-ssm-agent.service || true

          apt-get update -y
          apt-get install -y awscli

          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/instance-id)
          PUBLIC_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/public-ipv4 || echo none)

          REGION="ap-southeast-1"
          LOG_GROUP="app-d9fae51c-1929cc69-ec2-cert-scanner"
          LOG_STREAM="launch-$INSTANCE_ID"

          CERTS_DIR_STATUS="missing"
          [ -d /etc/ssl/certs ] && CERTS_DIR_STATUS="present"

          # --- Application certificates: internal CA, one CSR and signed leaf per host ---
          # This is the whole certificate lifecycle, run locally at first boot with
          # no intervention from anyone: generate a CA, generate a private key and
          # a CSR per service hostname, sign each CSR with the CA, install the
          # signed leaf where ec2-discovery-fn's scan will find it (APP_CERT_DIR).
          #
          # `openssl ca` rather than `openssl x509 -req`: only the former accepts
          # -startdate/-enddate on OpenSSL 3.0 (which is what Ubuntu 22.04 ships),
          # and backdating is the point — an inventory whose reason to exist is
          # expiry tracking has to contain certificates that have actually expired,
          # not just ones that will.
          CA_DIR=/opt/app/ca
          CERT_DIR=/opt/app/certs
          mkdir -p "$CA_DIR/newcerts" "$CA_DIR/private" "$CA_DIR/csr" "$CERT_DIR"
          chmod 700 "$CA_DIR/private"
          chmod 755 "$CERT_DIR"

          cat > "$CA_DIR/openssl.cnf" <<'CACONF'
          [ ca ]
          default_ca = CA_default

          [ CA_default ]
          dir             = /opt/app/ca
          new_certs_dir   = /opt/app/ca/newcerts
          database        = /opt/app/ca/index.txt
          serial          = /opt/app/ca/serial
          private_key     = /opt/app/ca/private/ca.key
          certificate     = /opt/app/ca/ca.crt
          default_md      = sha256
          policy          = policy_any
          email_in_dn     = no
          rand_serial     = no
          # Carries the subjectAltName from the CSR into the signed certificate,
          # so no separate -extfile is needed per host.
          copy_extensions = copy

          [ policy_any ]
          commonName             = supplied
          countryName            = optional
          stateOrProvinceName    = optional
          organizationName       = optional
          organizationalUnitName = optional
          emailAddress           = optional
          CACONF

          if [ ! -f "$CA_DIR/ca.crt" ]; then
            : > "$CA_DIR/index.txt"
            # `openssl ca` reads unique_subject from the database's .attr file, NOT
            # from openssl.cnf. Left to its default (yes) it refuses to re-sign a CN
            # it has signed before, so a second pass issues nothing while still
            # exiting 0 — a failure that looks exactly like success.
            echo "unique_subject = no" > "$CA_DIR/index.txt.attr"
            echo 1000 > "$CA_DIR/serial"
            openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
              -keyout "$CA_DIR/private/ca.key" -out "$CA_DIR/ca.crt" \
              -subj "/C=SG/O=app-d9fae51c-1929cc69/CN=app-d9fae51c-1929cc69 Internal CA"
            chmod 600 "$CA_DIR/private/ca.key"
          fi

          # The CA's own certificate belongs in the inventory too — it is a real
          # certificate on this instance, and it is the one whose expiry invalidates
          # every leaf below it.
          cp "$CA_DIR/ca.crt" "$CERT_DIR/internal-ca.pem"

          # host:days-until-expiry. Negative means already expired. Chosen to cover
          # every band the dashboard renders: expired, <=7d, <=30d, and beyond.
          APP_CERT_SPEC="payments.internal.example.com:-30
          metrics.svc.example.io:-3
          vpn.internal.example.com:2
          sso.internal.example.com:5
          api.internal.example.com:21
          mail.example.com:45
          checkout.svc.example.io:120
          gateway.corp.example.net:300"

          ISSUED=0
          FAILED=0
          for SPEC in $APP_CERT_SPEC; do
            HOST="${SPEC%:*}"
            DAYS="${SPEC##*:}"
            KEY="$CA_DIR/private/${HOST}.key"
            CSR="$CA_DIR/csr/${HOST}.csr"
            LEAF="$CERT_DIR/${HOST}.pem"

            # A one-year validity window ending at the offset above, so an expired
            # certificate reads as one that was issued and lapsed rather than one
            # that was never valid at all.
            END=$(date -u -d "${DAYS} days" +%Y%m%d%H%M%SZ)
            START=$(date -u -d "$((DAYS - 365)) days" +%Y%m%d%H%M%SZ)

            if openssl req -new -newkey rsa:2048 -nodes -sha256 \
                 -keyout "$KEY" -out "$CSR" \
                 -subj "/C=SG/O=app-d9fae51c-1929cc69/OU=CRM/CN=${HOST}" \
                 -addext "subjectAltName=DNS:${HOST}" 2>/dev/null \
               && openssl ca -batch -config "$CA_DIR/openssl.cnf" -notext \
                    -startdate "$START" -enddate "$END" \
                    -in "$CSR" -out "$LEAF" 2>/dev/null; then
              chmod 600 "$KEY"
              chmod 644 "$LEAF"
              ISSUED=$((ISSUED + 1))
            else
              FAILED=$((FAILED + 1))
              rm -f "$LEAF"
            fi
          done

          # A marker the discovery Lambda's operator can check: distinguishes "the
          # boot script has not finished yet" from "the boot script failed", which
          # otherwise look identical from an empty certificate directory.
          printf 'issued=%s failed=%s at=%s\n' "$ISSUED" "$FAILED" "$(date -u +%FT%TZ)" \
            > /opt/app/cert-issuance-status

          aws logs create-log-stream --region "$REGION" \
            --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          TS=$(($(date +%s%N)/1000000))
          MESSAGE="cert-scanner instance launched successfully: instance-id=$INSTANCE_ID public-ip=$PUBLIC_IP /etc/ssl/certs=$CERTS_DIR_STATUS app-certs-issued=$ISSUED app-certs-failed=$FAILED"
          aws logs put-log-events --region "$REGION" \
            --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" \
            --log-events "[{\"timestamp\": $TS, \"message\": \"$MESSAGE\"}]" || true

  Ec2CertScannerInstanceIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/ec2/cert-scanner-instance-id
      Type: String
      Value: !Ref Ec2CertScannerInstance
      Description: Instance id of the cert-scanner EC2 instance.

  Ec2CertScannerPrivateIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app-d9fae51c-1929cc69/ec2/cert-scanner-private-ip
      Type: String
      Value: !GetAtt Ec2CertScannerInstance.PrivateIp
      Description: Private IP of the cert-scanner EC2 instance.

  # ---------------------------------------------------------------------------
  # EventBridge schedules
  # ---------------------------------------------------------------------------
  EventBridgeSfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-d9fae51c-1929cc69-eventbridge-sfn-role
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-discovery-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DiscoverySfn

  DiscoveryScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-d9fae51c-1929cc69-discovery-daily
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: DiscoverySfnTarget
          Arn: !Ref DiscoverySfn
          RoleArn: !GetAtt EventBridgeSfnRole.Arn

  ExpiryScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-d9fae51c-1929cc69-expiry-hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: ExpiryEvaluatorTarget
          Arn: !GetAtt ExpiryEvaluatorFunction.Arn

  ExpiryEvaluatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExpiryEvaluatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryScheduleRule.Arn

  Ec2DiscoveryScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-d9fae51c-1929cc69-ec2-discovery-30min
      Description: Trigger EC2 OS certificate discovery every 30 minutes
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: Ec2DiscoveryFunctionTarget
          Arn: !GetAtt Ec2DiscoveryFunction.Arn

  Ec2DiscoveryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Ec2DiscoveryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Ec2DiscoveryScheduleRule.Arn

Outputs:
  AppUrl:
    Description: Self-service UI (CloudFront)
    Value: !Sub "https://${UiDistribution.DomainName}"
  ApiUrl:
    Description: REST API base URL
    Value: !Sub "https://${CrmApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UiSiteBucketName:
    Value: !Ref UiSiteBucket
  CloudFrontDistributionId:
    Value: !Ref UiDistribution
  CertInventoryTableName:
    Value: !Ref CertInventoryTable
  IamAccountsTableName:
    Value: !Ref IamAccountsTable
  AuditHotTableName:
    Value: !Ref AuditHotTable
  PasswordResetRequestsTableName:
    Value: !Ref PasswordResetRequestsTable
  CertScannerInstanceId:
    Description: EC2 cert-scanner instance id (also in SSM Parameter Store)
    Value: !Ref Ec2CertScannerInstance
  CertScannerPublicIp:
    Description: EC2 cert-scanner public IP (SSM Session Manager; no SSH is open)
    Value: !GetAtt Ec2CertScannerInstance.PublicIp
