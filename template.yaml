    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-d9fae51c-1929cc69-jira-dlq-depth
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JiraDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref OpsAlarmsTopic

